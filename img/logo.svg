<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E04040"/>
      <stop offset="100%" style="stop-color:#b53030"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer ring - blight aura -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="24" cy="24" r="20" fill="none" stroke="#E04040" stroke-width="0.5" opacity="0.2"/>
  <!-- Wolf eye shape -->
  <path d="M10 24 Q16 12 24 14 Q32 12 38 24 Q32 36 24 34 Q16 36 10 24Z" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
  <!-- Pupil -->
  <ellipse cx="24" cy="24" rx="5" ry="6" fill="#E04040" opacity="0.9"/>
  <ellipse cx="24" cy="24" rx="3" ry="4" fill="#0e141c"/>
  <!-- Vine tendrils around eye -->
  <path d="M10 24 Q8 20 4 18" fill="none" stroke="#E04040" stroke-width="1" opacity="0.7"/>
  <path d="M38 24 Q40 20 44 18" fill="none" stroke="#E04040" stroke-width="1" opacity="0.7"/>
  <path d="M16 34 Q12 38 14 42" fill="none" stroke="#b53030" stroke-width="1" opacity="0.5"/>
  <path d="M32 34 Q36 38 34 42" fill="none" stroke="#b53030" stroke-width="1" opacity="0.5"/>
  <!-- Blight particle -->
  <circle cx="20" cy="16" r="1" fill="#9b59b6" opacity="0.8"/>
  <circle cx="30" cy="36" r="1" fill="#9b59b6" opacity="0.5"/>
</svg>
